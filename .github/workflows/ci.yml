name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate conventional PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ ^(feat|fix|docs|chore|refactor|test)(\([A-Za-z0-9._/-]+\))?!?:\ .+ ]]; then
            exit 0
          fi
          echo "PR title must use a conventional-commit prefix" >&2
          exit 1

  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: "22.19.0"
            command: bun run check
          - os: ubuntu-24.04
            node: "24.8.0"
            command: bun run test:pi && bun run check:package
          - os: macos-15
            node: "22.19.0"
            command: bun run test:pi && bun run check:package
          - os: macos-15
            node: "24.8.0"
            command: bun run test:pi && bun run check:package
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Install Bun 1.3.14
        shell: bash
        run: curl -fsSL https://bun.sh/install | bash -s -- bun-v1.3.14
      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run checks
        run: ${{ matrix.command }}
