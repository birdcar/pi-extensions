name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate conventional PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ ^(feat|fix|docs|chore|refactor|test)(\([A-Za-z0-9._/-]+\))?!?:\ .+ ]]; then
            exit 0
          fi
          echo "PR title must use a conventional-commit prefix" >&2
          exit 1

  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: "22.19.0"
            command: bun run check
          - os: ubuntu-24.04
            node: "24.8.0"
            command: bun run test:pi && bun run check:package
          - os: macos-15
            node: "22.19.0"
            command: bun run test:pi && bun run check:package
          - os: macos-15
            node: "24.8.0"
            command: bun run test:pi && bun run check:package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install Bun 1.3.14
        shell: bash
        run: curl -fsSL https://bun.sh/install | bash -s -- bun-v1.3.14
      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run checks
        run: ${{ matrix.command }}

  changeset-status:
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.8.0"
          package-manager-cache: false
      - name: Install Bun 1.3.14
        shell: bash
        run: curl -fsSL https://bun.sh/install | bash -s -- bun-v1.3.14
      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Require a changeset for package changes
        run: bun run changeset status --since=origin/main
